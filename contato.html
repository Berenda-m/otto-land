<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato-Meu site</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Otto Lego-Land</h1>
        <!--Navegação-->
        <nav>
            <a href="index.html" class="button">Página inicial</a>
            <a href="sobre.html" class="button">Sobre</a>
        </nav>
    </header>
    <main>
        <form action="obrigado.html" method="get">
            <fieldset>
                <legend>Dados pessoais</legend>
                <div class="campo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required minlength="3">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="seuemail@com.br" required minlength="3">
                    <label for="tel">Telefone</label>
                    <input type="tel" id="Telefone" placeholder="(47) 9999-9999">
                </div>
                <!-- campos aqui -->
            </fieldset>
            <fieldset>
                <legend>Mensagem</legend>
                <!-- campos aqui -->
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione o assunto</option>
                    <option value="orcamento">Orçamento</option>
                    <option value="suporte">Suporte técnico</option>
                    <option value="parceria">Parceria</option>
                </select>
                <textarea id="mensagem" name="mensagem" rows="5" minlength="20" required
                    placeholder="Descreva seu projeto..."></textarea>
                <div class="campo">
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">
                        Aceito os
                        <a href="termos.html">termos de uso</a>
                    </label>
                </div>
            </fieldset>
            <div>
                <button class="button" type="reset">Limpar formulário</button>
                <button class="button" type="submit">Enviar mensagem</button>
            </div>
        </form>
        <table class="tabela">
            <caption>Horários de atendimento</caption>
            <thead>
                <tr>
                    <th scope="col">Dia</th>
                    <th scope="col">Horário</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Seg–Sex</td>
                    <td>8h–18h</td>
                </tr>
                <tr>
                    <td>Sábado</td>
                    <td>9h–13h</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Domingo: fechado</td>
                </tr>
            </tfoot>
        </table>
    </main>
</body>

</html>
